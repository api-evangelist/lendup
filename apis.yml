aid: lendup
name: LendUp
description: >-
  LendUp was a San Francisco consumer-lending fintech founded in 2011 and backed by GV and QED
  Investors, offering single-payment and installment loans to subprime borrowers alongside a gamified
  "LendUp Ladder" program that promised cheaper credit and credit-bureau reporting as borrowers repaid.
  LendUp Loans LLC ceased lending operations in January 2022 following Consumer Financial Protection
  Bureau enforcement actions over misleading marketing and pricing claims. The lendup.com domain is
  now operated by an unrelated company, LendUp LLC of Dover, Delaware, which runs a consumer
  loan-matching and financial-education site connecting borrowers to licensed lenders for a referral
  fee; it states it has no corporate, ownership, or operational relationship to the former lender and
  no access to its customer data. Neither entity publishes a public API, developer portal, SDKs, or
  any machine-readable discovery surface.
